name: CI

on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run quick syntax check
        run: |
          python -m py_compile src/**/*.py
      - name: Execute notebook (headless, no GPU)
        run: |
          pip install nbconvert
          jupyter nbconvert --to notebook --execute notebooks/01_full_pipeline.ipynb --output /dev/null --ExecutePreprocessor.timeout=600 --ExecutePreprocessor.kernel_name=python3